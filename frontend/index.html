<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Котлован</title>
    <script src="https://cdn.tailwindcss.com"></script>
        <style>
      /* Mobile touch ergonomics & prevent unwanted browser bouncing */
      html, body, #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        background-color: #0b1120;
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.9); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 0.35; }
        100% { transform: scale(0.9); opacity: 0.9; }
      }
      .animate-target-pulse {
        animation: pulse-ring 1.8s infinite ease-in-out;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased select-none overflow-hidden font-sans">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.js"></script></body>
</html>
