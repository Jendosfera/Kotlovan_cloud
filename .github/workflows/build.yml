name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Сборка веб-приложения — работает ТОЛЬКО в папке frontend
      - name: Build web app
        working-directory: frontend
        run: |
          npm install
          npm run build

      # 2. Capacitor — работает ТОЛЬКО в корне репозитория (без working-directory!)
      - name: Setup Capacitor and generate Android project
        run: |
          rm -f capacitor.config.ts

          cat > capacitor.config.json << 'EOF'
          {
            "appId": "ru.kotlovan.app",
            "appName": "Kotlovan",
            "webDir": "frontend/dist"
          }
          EOF

          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Диагностика: убедимся, что dist существует
          ls -la frontend/dist || { echo "ОШИБКА: frontend/dist не найден — сборка Vite не удалась"; exit 1; }

          npx cap add android
          npx cap sync android

          # Диагностика: папка android должна появиться в корне
          ls -la android

      # 3. Сборка APK — тоже из корня
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      # 4. Сохранение APK в артефакты
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
