name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Сборка веб-приложения через Vite
      - name: Build web app
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Setup Capacitor and generate Android project
        run: |
          # Убираем испорченный ts-конфиг, если остался от прошлых запусков
          rm -f capacitor.config.ts

          # Создаём JSON-конфиг (читается без TypeScript)
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "ru.kotlovan.app",
            "appName": "Kotlovan",
            "webDir": "frontend/dist"
          }
          EOF
      # 3. Сборка APK через Gradle
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      # 4. Сохранение APK в артефакты (скачать из вкладки Actions)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
